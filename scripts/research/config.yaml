model:
  api_key: POLZA_API_KEY
  base_url: https://polza.ai/api/v1/
  default: deepseek/deepseek-v4-flash-0731
  provider: polza
  fallback: '[{"provider": "aitunnel-flash", "model": "deepseek-v4-flash"}]'
toolsets:
- hermes-cli
- web
auxiliary:
  vision:
    provider: aitunnel-flash
    model: qwen3.7-flash
  web_extract:
    provider: aitunnel-flash
    model: deepseek-v4-flash
  compression:
    provider: aitunnel-flash
    model: deepseek-v4-flash
  curator:
    provider: aitunnel-flash
    model: deepseek-v4-flash
delegation:
  inherit_mcp_toolsets: false
  max_iterations: 30
  child_timeout_seconds: 1800
  max_concurrent_children: 3
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: true
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
_config_version: 33
mcp_servers:
  writer:
    command: /home/orangepi/.hermes/hermes-agent/venv/bin/python
    args:
    - /home/orangepi/.hermes/profiles/resercher/mcp/writer_server.py
    timeout: 60
    env:
      HERMES_HOME: /home/orangepi/.hermes/profiles/resercher
  literature:
    command: /home/orangepi/.hermes/hermes-agent/venv/bin/python
    args:
    - /home/orangepi/.hermes/profiles/resercher/mcp/literature_server.py
    timeout: 120
    env:
      HERMES_HOME: /home/orangepi/.hermes/profiles/resercher
custom_providers:
