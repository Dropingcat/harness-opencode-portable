thresholds:
  problematic: 0.6
  tribunal_trigger: 0.8
verdict_recalculation:
  confidence_lt_0.6:
    action: set_verdict
    value: UNSUPPORTED
    reason: confidence_below_problematic_threshold
  confidence_0.6_to_0.8:
    action: set_verdict
    value: AMBIGUOUS
    reason: confidence_in_ambiguous_range
caveat_rules:
  critical_caveat:
    action: cap_confidence
    value: 0.6
    reason: critical_caveat_caps_confidence
  critical_caveat_count_gte_1:
    action: trigger_tribunal
    reason: critical_caveat_triggers_tribunal
  caveats_count_gte_2:
    action: mark_problematic
    reason: multiple_caveats_problematic
  caveats_count_gte_3:
    action: cap_confidence
    value: 0.5
    reason: many_caveats_caps_confidence
numeric_rules:
  numeric_mismatch:
    action: set_verdict
    value: UNSUPPORTED
    cap_confidence: 0.3
    reason: numeric_mismatch_unsupported
  numeric_partial_match:
    action: cap_confidence
    value: 0.6
    reason: numeric_partial_match_capped
  qualifier_mismatch:
    action: cap_confidence
    value: 0.5
    reason: qualifier_mismatch_capped
  no_numeric_data:
    action: cap_confidence
    value: 0.7
    reason: no_numeric_data_capped
  dimension_mismatch:
    action: set_verdict
    value: UNSUPPORTED
    cap_confidence: 0.3
    reason: dimension_mismatch_unsupported
problematic_rules:
  verdict_unsupported:
    action: mark_problematic
  verdict_ambiguous:
    action: mark_problematic
  confidence_lt_0.6:
    action: mark_problematic
tribunal_rules:
  trigger_when:
  - critical_caveat_count_gte_1
  - verdict_ambiguous_after_postprocess
  - verdict_contradicted
  skip_when:
  - no_caveats
  - confidence_gte_0.8_and_no_critical
source_trust:
  primary: 0.9
  textbook: 0.9
  review: 0.75
  educational: 0.7
  wikipedia: 0.6
  researchgate: 0.6
  blog: 0.3
  local_md: 0.75
  low_trust_only:
    action: cap_confidence
    value: 0.5
    reason: low_trust_sources_only
justification_required:
  enabled: true
  fallback_status: OPEN
  open_reason: verdict_without_justification
  fields:
  - justification
  - reason
  - evidence
  - rationale
escalation_rules:
  seeds:
  - AMBIGUOUS
  - UNSUPPORTED
  - OPEN
  max_hops: 3
  max_nodes: 15
  max_tokens: 40000
  convergence:
    min_verdicts: 2
    min_confidence: 0.8
    max_dispersion: 0.2
  cut_off:
    status: OPEN
    alarm_type: escalation_cutoff
