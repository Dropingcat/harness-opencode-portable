# Жанр: Научная статья / Лонгрид
genre:
  id: "article_longread"
  name: "Научная статья / Лонгрид"
  version: "1.0"
  schema_version: "1.0"
  language: ["ru", "en", "bilingual"]
  gost: "Р 7.0.5"

skeleton_template: "article_longread_skeleton.yaml"

apparatus_rules:
  required_fields:
    - "relevance"
    - "goal"
    - "novelty"
  optional_fields:
    - "hypothesis"
    - "methods_summary"

required_sections:
  - "introduction"
  - "methods"
  - "results"
  - "discussion"
  - "conclusion"
  - "literature"

optional_sections:
  - "supplementary"

claim_kinds_allowed:
  - "SOURCE"
  - "SYNTHESIS"
  - "PRACTICE"
  - "RECOMMENDATION"
  - "INFERENCE"
  - "EXTRAPOLATION"
  - "NUMERIC_CLAIM"

object_kinds_allowed:
  - "number"
  - "formula"
  - "citation"
  - "term"
  - "table"
  - "figure"

validators:
  - "UnitAtomicityValidator"
  - "UnitProvenanceValidator"
  - "UnitCitationValidator"
  - "UnitStyleValidator"
  - "UnitConsistencyValidator"
  - "ObjectValidator"
  - "WriterEligibilityValidator"

style_profile_template: "article_style.yaml"

export_formats: ["md", "docx", "pdf", "latex", "html"]
export_templates:
  docx: "templates/article_gost.docx"
  pdf: "templates/article_gost.latex"
  html: "templates/article.html"

budget_defaults:
  words_min: 3000
  words_max: 15000
  pages_min: 5
  pages_max: 20