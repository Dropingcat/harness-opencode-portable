# Жанр: Книга (многотомная)
genre:
  id: "book"
  name: "Научная книга / Учебное пособие"
  version: "1.0"
  schema_version: "1.0"
  language: ["ru", "en", "bilingual"]
  gost: "Р 7.0.5"

skeleton_template: "book_skeleton.yaml"

apparatus_rules:
  required_fields:
    - "relevance"
    - "goal"
    - "audience"
  optional_fields:
    - "prerequisites"
    - "learning_outcomes"

required_sections:
  - "preface"
  - "part_1"
  - "part_2"
  - "conclusion"
  - "literature"
  - "appendices"
  - "index"

optional_sections:
  - "glossary"
  - "list_of_figures"
  - "list_of_tables"

claim_kinds_allowed:
  - "SOURCE"
  - "SYNTHESIS"
  - "PRACTICE"
  - "RECOMMENDATION"
  - "INFERENCE"
  - "EXTRAPOLATION"
  - "THEORETICAL"
  - "HISTORICAL_EVENT"

object_kinds_allowed:
  - "number"
  - "formula"
  - "citation"
  - "term"
  - "table"
  - "figure"
  - "exercise"

validators:
  - "UnitAtomicityValidator"
  - "UnitProvenanceValidator"
  - "UnitCitationValidator"
  - "UnitStyleValidator"
  - "UnitConsistencyValidator"
  - "ObjectValidator"
  - "WriterEligibilityValidator"
  - "SkeletonCompletenessValidator"

style_profile_template: "book_style.yaml"

export_formats: ["md", "docx", "pdf", "latex", "epub"]
export_templates:
  docx: "templates/book_gost.docx"
  pdf: "templates/book_gost.latex"
  epub: "templates/book.epub"

budget_defaults:
  words_min: 80000
  words_max: 300000
  pages_min: 200
  pages_max: 600