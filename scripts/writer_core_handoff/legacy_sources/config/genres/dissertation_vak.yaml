# Жанр: Диссертация ВАК (ГОСТ Р 7.0.11)
genre:
  id: "dissertation_vak"
  name: "Диссертация на соискание учёной степени (ВАК)"
  version: "1.0"
  schema_version: "1.0"
  language: ["ru", "bilingual"]
  gost: "Р 7.0.11"

skeleton_template: "dissertation_vak_skeleton.yaml"

apparatus_rules:
  required_fields:
    - "relevance"
    - "object_subject"
    - "goal_tasks"
    - "hypothesis"
    - "novelty"
    - "positions"
    - "approbation"
  optional_fields: []

required_sections:
  - "introduction"
  - "literature_review"
  - "methodology"
  - "results"
  - "discussion"
  - "conclusion"
  - "literature"
  - "appendix"

optional_sections:
  - "appendix_a"
  - "appendix_b"

claim_kinds_allowed:
  - "SOURCE"
  - "SYNTHESIS"
  - "PRACTICE"
  - "RECOMMENDATION"
  - "INFERENCE"
  - "EXTRAPOLATION"
  - "GAP_DECLARATION"
  - "DIAGNOSTIC_INFERENCE"
  - "NUMERIC_CLAIM"
  - "NUMERIC_SOURCE_CLAIM"

object_kinds_allowed:
  - "number"
  - "formula"
  - "citation"
  - "term"
  - "table"
  - "figure"

validators:
  - "UnitAtomicityValidator"
  - "UnitProvenanceValidator"
  - "UnitCitationValidator"
  - "UnitStyleValidator"
  - "UnitConsistencyValidator"
  - "ObjectValidator"
  - "WriterEligibilityValidator"
  - "SkeletonCompletenessValidator"

style_profile_template: "dissertation_style.yaml"

export_formats: ["md", "docx", "pdf", "latex"]
export_templates:
  docx: "templates/dissertation_gost.docx"
  pdf: "templates/dissertation_gost.latex"

cloning_instructions:
  - "Скопировать skeleton.yaml в новую работу"
  - "Подставить title, spec_vak, gost"
  - "Настроить apparatus_fields под спецификацию (код ВАК)"
  - "Настроить required_sections под объём (минимум 6 глав)"
  - "Добавить spec_vak в metadata работы"

budget_defaults:
  words_min: 80000
  words_max: 150000
  pages_min: 120
  pages_max: 200