# Жанр: Монография (ГОСТ Р 7.0.5)
genre:
  id: "monograph"
  name: "Научная монография"
  version: "1.0"
  schema_version: "1.0"
  language: ["ru", "en", "bilingual"]
  gost: "Р 7.0.5"

skeleton_template: "monograph_skeleton.yaml"

apparatus_rules:
  required_fields:
    - "relevance"
    - "object_subject"
    - "goal_tasks"
    - "hypothesis"
    - "novelty"
    - "positions"
    - "approbation"
  optional_fields:
    - "theoretical_basis"
    - "methodology_details"

required_sections:
  - "introduction"
  - "chapter_1"
  - "chapter_2"
  - "conclusion"
  - "literature"

optional_sections:
  - "appendix"
  - "glossary"

claim_kinds_allowed:
  - "SOURCE"
  - "SYNTHESIS"
  - "PRACTICE"
  - "RECOMMENDATION"
  - "INFERENCE"
  - "EXTRAPOLATION"
  - "GAP_DECLARATION"
  - "HISTORICAL_EVENT"
  - "THEORETICAL"

object_kinds_allowed:
  - "number"
  - "formula"
  - "citation"
  - "term"
  - "table"
  - "figure"

validators:
  - "UnitAtomicityValidator"
  - "UnitProvenanceValidator"
  - "UnitCitationValidator"
  - "UnitStyleValidator"
  - "UnitConsistencyValidator"
  - "ObjectValidator"
  - "WriterEligibilityValidator"
  - "SkeletonCompletenessValidator"

style_profile_template: "monograph_style.yaml"

export_formats: ["md", "docx", "pdf", "latex"]
export_templates:
  docx: "templates/monograph_gost.docx"
  pdf: "templates/monograph_gost.latex"

budget_defaults:
  words_min: 60000
  words_max: 120000
  pages_min: 100
  pages_max: 200