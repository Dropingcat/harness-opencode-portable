# Жанр: Научный отчёт (ГОСТ 7.32)
genre:
  id: "scientific_report"
  name: "Научный отчёт (ГОСТ 7.32)"
  version: "1.0"
  schema_version: "1.0"
  language: ["ru", "en", "bilingual"]
  gost: "7.32-2017"

skeleton_template: "scientific_report_skeleton.yaml"

apparatus_rules:
  required_fields:
    - "objective"
    - "methods"
    - "results_summary"
    - "conclusions"
  optional_fields:
    - "recommendations"

required_sections:
  - "title_page"
  - "abstract"
  - "introduction"
  - "methods"
  - "results"
  - "discussion"
  - "conclusions"
  - "references"
  - "appendices"

optional_sections:
  - "acknowledgments"
  - "glossary"

claim_kinds_allowed:
  - "SOURCE"
  - "SYNTHESIS"
  - "PRACTICE"
  - "RECOMMENDATION"
  - "INFERENCE"
  - "NUMERIC_CLAIM"

object_kinds_allowed:
  - "number"
  - "formula"
  - "citation"
  - "term"
  - "table"
  - "figure"

validators:
  - "UnitAtomicityValidator"
  - "UnitProvenanceValidator"
  - "UnitCitationValidator"
  - "UnitStyleValidator"
  - "UnitConsistencyValidator"
  - "ObjectValidator"
  - "WriterEligibilityValidator"

style_profile_template: "report_style.yaml"

export_formats: ["md", "docx", "pdf", "latex"]
export_templates:
  docx: "templates/report_gost.docx"
  pdf: "templates/report_gost.latex"

budget_defaults:
  words_min: 5000
  words_max: 30000
  pages_min: 10
  pages_max: 50