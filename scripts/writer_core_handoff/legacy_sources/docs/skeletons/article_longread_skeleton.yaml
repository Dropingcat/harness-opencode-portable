# Скелет статьи/лонгрида
document:
  id: "DOC_SKELETON"
  genre: "article_longread"
  gost: "Р 7.0.5"
  skeleton_version: "1.0"

skeleton:
  - id: "SEC_INTRO"
    type: "section"
    title: "Введение"
    role: "introduction"
    children:
      - id: "PAR_INTRO_HOOK"
        type: "paragraph"
        role: "hook"
        required: true
      - id: "PAR_INTRO_GOAL"
        type: "paragraph"
        role: "goal"
        required: true

  - id: "SEC_METHODS"
    type: "section"
    title: "Методы"
    role: "methods"
    children:
      - id: "PAR_METH_APPROACH"
        type: "paragraph"
        role: "approach"
        required: true

  - id: "SEC_RESULTS"
    type: "section"
    title: "Результаты"
    role: "results"
    children:
      - id: "PAR_RES_MAIN"
        type: "paragraph"
        role: "main_results"
        required: true
      - id: "PAR_RES_DETAIL"
        type: "paragraph"
        role: "detail"
        required: true

  - id: "SEC_DISC"
    type: "section"
    title: "Обсуждение"
    role: "discussion"
    children:
      - id: "PAR_DISC_INT"
        type: "paragraph"
        role: "interpretation"
        required: true
      - id: "PAR_DISC_LIM"
        type: "paragraph"
        role: "limitations"
        required: true

  - id: "SEC_CONCL"
    type: "section"
    title: "Заключение"
    role: "conclusion"
    children:
      - id: "PAR_CONCL"
        type: "paragraph"
        role: "conclusion"
        required: true

  - id: "SEC_LIT"
    type: "section"
    title: "Список литературы"
    role: "literature"
    children:
      - id: "PAR_BIB"
        type: "paragraph"
        role: "bibliography"
        required: true