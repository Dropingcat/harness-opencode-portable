# Скелет монографии (ГОСТ Р 7.0.5)
document:
  id: "DOC_SKELETON"
  genre: "monograph"
  gost: "Р 7.0.5"
  skeleton_version: "1.0"

skeleton:
  - id: "SEC_INTRO"
    type: "section"
    title: "Введение"
    role: "introduction"
    apparatus:
      relevance: true
      object_subject: true
      goal_tasks: true
      hypothesis: true
      novelty: true
      positions: true
      approbation: true
    children:
      - id: "SEC_INTRO_REL"
        type: "paragraph"
        role: "relevance"
        required: true
      - id: "SEC_INTRO_GOAL"
        type: "paragraph"
        role: "goal_tasks"
        required: true

  - id: "PART_1"
    type: "part"
    title: "Часть I. Теоретические основы"
    role: "theoretical_basis"
    children:
      - id: "CH_1_1"
        type: "section"
        title: "Глава 1. Обзор литературы"
        role: "literature_review"
        children:
          - id: "PAR_1_1_1"
            type: "paragraph"
            role: "state_of_art"
            required: true
          - id: "PAR_1_1_2"
            type: "paragraph"
            role: "gap_declaration"
            required: true

      - id: "CH_1_2"
        type: "section"
        title: "Глава 2. Теоретические подходы"
        role: "theoretical_approaches"
        children:
          - id: "PAR_1_2_1"
            type: "paragraph"
            role: "theory"
            required: true

  - id: "PART_2"
    type: "part"
    title: "Часть II. Эмпирические исследования"
    role: "empirical_studies"
    children:
      - id: "CH_2_1"
        type: "section"
        title: "Глава 3. Методология"
        role: "methodology"
        children:
          - id: "PAR_2_1_1"
            type: "paragraph"
            role: "method"
            required: true

      - id: "CH_2_2"
        type: "section"
        title: "Глава 4. Результаты"
        role: "results"
        children:
          - id: "PAR_2_2_1"
            type: "paragraph"
            role: "main_results"
            required: true
          - id: "PAR_2_2_2"
            type: "paragraph"
            role: "analysis"
            required: true

  - id: "SEC_CONCL"
    type: "section"
    title: "Заключение"
    role: "conclusion"
    children:
      - id: "PAR_CONCL_1"
        type: "paragraph"
        role: "summary"
        required: true
      - id: "PAR_CONCL_2"
        type: "paragraph"
        role: "positions"
        required: true

  - id: "SEC_LIT"
    type: "section"
    title: "Список литературы"
    role: "literature"
    children:
      - id: "PAR_LIT"
        type: "paragraph"
        role: "bibliography"
        required: true

  - id: "SEC_APP"
    type: "section"
    title: "Приложения"
    role: "appendix"
    required: false