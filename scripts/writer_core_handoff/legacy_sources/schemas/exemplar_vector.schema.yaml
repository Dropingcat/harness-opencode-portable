# 26. ExemplarVector — schema v0.1
# Структура вектора «эталонной функции» из docs/26_CORE_KERNEL_AND_EXEMPLAR_VECTOR.md §3.1
# Формат: dict из компонент; каждый компонент — дистрибуция/статистика, НЕ embedding-среднее.
$id: writer-core-2/exemplar-vector/0.1
$type: object
required: [vector_id, genre, domain, regime, version, components, built_from, calibration]

properties:
  vector_id: {type: string}          # e.g. "EV_MATERIALS_DISSER@v1"
  genre: {type: string}              # dissertation_vak | monograph | article_longread | scientific_report
  domain: {type: string}             # metallurgy, medicine, philosophy, ...
  language: {enum: [ru, en, bilingual]}
  regime:
    type: object                      # кластер режимов из кластеризации эталонов
    required: [regime_id, description]
    properties:
      regime_id: {type: string}       # "original_research" | "compilative_review" | ...
      description: {type: string}
  version: {type: string}

  components:
    type: object                       # V = кортеж компонент (A..I из docs/26 §3.1)
    required: [claim_type_distribution, artifact_density, discourse_flow_profile, style_vector]
    properties:
      # A. Дистрибуция claim-типов (epistemic_argument graph)
      claim_type_distribution:
        type: object
        additionalProperties: {type: number}   # {OBSERVATIONAL: 0.42, INTERPRETIVE: 0.68, ...}
      # B. Дистрибуция эпистемических статусов
      evidence_state_distribution:
        type: object
        additionalProperties: {type: number}
      # C. Плотность артефактов (artifact_symbol graph) — детерминированные отношения
      artifact_density:
        type: object
        required: [numbers_per_claim, formulas_per_1000w, citations_per_claim, tables_per_1000w]
        properties:
          numbers_per_claim: {type: number}
          formulas_per_1000w: {type: number}
          citations_per_claim: {type: number}
          tables_per_1000w: {type: number}
      # D. Дискурс-поток (discourse graph)
      discourse_flow_profile:
        type: object
        required: [order, transition_ratios]
        properties:
          order: {type: array, items: {type: string}}    # [STATE_OF_ART, GAP, METHOD, RESULT, ...]
          transition_ratios:
            type: object
            additionalProperties: {type: number}
      # E. Аргументные схемы (epistemic + discourse)
      argument_scheme_frequency:
        type: object
        additionalProperties: {type: number}
      # F. Структура абзаца (document_structure graph)
      paragraph_signature:
        type: object
        required: [avg_sentences, avg_claims_per_paragraph]
        additionalProperties: {type: number}
      # G. Стиль (style_profile)
      style_vector:
        type: object
        required: [avg_sentence_len, passive_ratio, hedging_ratio, term_density, readability]
        properties:
          avg_sentence_len: {type: number}
          passive_ratio: {type: number}
          hedging_ratio: {type: number}
          term_density: {type: number}
          readability: {type: number}
      # H. Терминосистема (vocabulary graph)
      term_concentration:
        type: object
        required: [unique_terms_per_1000w, domain_jargon_density]
        additionalProperties: {type: number}
      # I. Графовая сигнатура (graph-level statistics)
      graph_signature:
        type: object
        required: [avg_degree, clustering, longest_path, bridge_density]
        additionalProperties: {type: number}

  built_from:
    type: object                        # источник построения вектора
    required: [source_count, source_ids, method, aggregation]
    properties:
      source_count: {type: integer}
      source_ids: {type: array, items: {type: string}}   # ID работ-эталонов
      method: {type: string}            # "median_iqr_aggregation" | "mean" | ...
      aggregation: {type: string}       # "median" | "mean"
      calibration_ref: {type: string}   # ссылка на калибровочный отчёт

  calibration:
    type: object                        # ОБЯЗАТЕЛЬНО: калибровка отделимости (docs/26 G-2)
    required: [separability_score, method, verdict]
    properties:
      separability_score: {type: number} # 0..1 (silhouette/separability)
      method: {type: string}            # "silhouette" | "nn_separability" | ...
      verdict: {enum: [CALIBRATED, NOT_CALIBRATED, INCONCLUSIVE]}

  # Диагностика по умолчанию: вектор НИКОГДА не усиливает epistemics.
  semantic_guard:
    type: object
    required: [monotonicity, allowed_uses, forbidden_uses]
    properties:
      monotonicity: {enum: [PRESERVE_EPISTEMICS, RAISE_BLOCKER]}
      allowed_uses: {type: array, items: {type: string}}
      forbidden_uses: {type: array, items: {type: string}}  # ["causality_upgrade", "scope_expansion", "claim_invention"]