$id: writer-core-2/writing-contract/0.2
$type: object
required:
- contract_id
- projection_version
- policy_snapshot_ref
- claims
- slots
properties:
  contract_id:
    type: string
  projection_version:
    type: string
  policy_snapshot_ref:
    type: string
  claims:
    type: array
    items:
      type: object
      required:
      - claim_id
      - proposition
      - claim_type
      - writer_eligibility
      properties:
        claim_id:
          type: string
        proposition:
          type: string
        claim_type:
          type: string
        scope_ref:
          type:
          - string
          - 'null'
        writer_eligibility:
          enum:
          - ALLOWED
          - QUALIFIED
          - FORBIDDEN
        modality:
          type:
          - string
          - 'null'
        causal_level:
          type:
          - string
          - 'null'
        required_qualifiers:
          type: array
          items:
            type: string
        forbidden_transformations:
          type: array
          items:
            type: string
        evidence_refs:
          type: array
          items:
            type: string
        numeric_refs:
          type: array
          items:
            type: string
        uncertainty_refs:
          type: array
          items:
            type: string
        criticality:
          type:
          - string
          - 'null'
        visibility:
          type:
          - string
          - 'null'
  slots:
    type: array
    items:
      type: object
      required:
      - slot_id
      - discourse_role
      - required_claims
      properties:
        slot_id:
          type: string
        section_contract_ref:
          type:
          - string
          - 'null'
        discourse_role:
          type: string
        argument_role:
          type:
          - string
          - 'null'
        required_claims:
          type: array
          items:
            type: string
        optional_claims:
          type: array
          items:
            type: string
        forbidden_claims:
          type: array
          items:
            type: string
        required_artifacts:
          type: array
          items:
            type: string
        semantic_type_requirements:
          type: array
          items:
            type: string
        completion_criteria:
          type: array
          items:
            type: string
