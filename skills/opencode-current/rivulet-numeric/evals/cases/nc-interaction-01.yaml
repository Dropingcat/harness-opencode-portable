schema_version: 2
id: nc-interaction-01
mode: deterministic
skill_under_test: rivulet-numeric
runner: opencode
skills_loaded: [rivulet-numeric]
description: "Режим (б): общий вход verdicts.json через два блока (evidence_contract + numeric_comparator) → согласованные evidence и comparison"
tags: [rivulet, interaction, shared-input, evidence_contract, numeric_comparator]

setup:
  fixtures:
    "verdicts.json": fixtures/verdicts.json
    "sources.json": fixtures/sources.json
    "rules.yaml": fixtures/rules.yaml

prompt: |
  Pipeline interaction test on a shared input. Using verdicts.json, run BOTH blocks:
    1) python3 /home/orangepi/projects/claimeai-service/scripts/evidence_contract.py verdicts.json rules.yaml evidence.json
    2) python3 /home/orangepi/projects/claimeai-service/scripts/numeric_comparator.py verdicts.json sources.json comparison.json
  Then read evidence.json and comparison.json and report their key fields
  (evidence source_id/trust and comparison status).
  Do not modify any source files under /home/orangepi/projects/claimeai-service/scripts/.

budget:
  max_tokens: 1200
  max_seconds: 240

checks:
  - kind: file_exists
    path: evidence.json
  - kind: file_exists
    path: comparison.json
  - kind: jq_path_contains
    file: evidence.json
    path: "[.[0].evidence[0].source_id]"
    contains: ["handbook_steel_45"]
  - kind: jq_path_contains
    file: evidence.json
    path: "[.[0].evidence[0].trust]"
    contains: [0.95]
  - kind: jq_path_contains
    file: comparison.json
    path: "[.groups[0].group_status]"
    contains: ["match"]
  - kind: shell
    cmd: "grep -c -F 'Handbook Steel 45' comparison.json"
    expect_min: 1