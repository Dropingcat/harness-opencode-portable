schema_version: 2
id: nc-isolated-02
mode: deterministic
skill_under_test: rivulet-numeric
runner: opencode
skills_loaded: [rivulet-numeric]
description: "Режим (а): numeric_comparator изолированно, непересекающиеся диапазоны → mismatch"
tags: [rivulet, numeric_comparator, isolated, mismatch]

setup:
  fixtures:
    "verdicts.json": fixtures/v102.json
    "sources.json": fixtures/s102.json

prompt: |
  Run the numeric comparison block in isolation. Execute:
    python3 /home/orangepi/projects/claimeai-service/scripts/numeric_comparator.py verdicts.json sources.json output.json
  Then read output.json and report the top-level "status" field in one line.
  Do not modify any source files under /home/orangepi/projects/claimeai-service/scripts/.

budget:
  max_tokens: 1000
  max_seconds: 180

checks:
  - kind: file_exists
    path: output.json
  - kind: jq_path_contains
    file: output.json
    path: "[.groups[0].group_status]"
    contains: ["mismatch"]
  - kind: jq_path_contains
    file: output.json
    path: "[.groups[0].claims[0].claim_numbers[0].type]"
    contains: ["range"]