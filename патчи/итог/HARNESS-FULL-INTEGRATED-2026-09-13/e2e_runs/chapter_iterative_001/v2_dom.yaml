product:
  id: PROD-E2E
  kind: dissertation
claims:
- id: C-001
  text: После азотирования стали Р6М5 линия (110) α-фазы уширяется, ее интенсивность
    снижается и максимум смещается к меньшим углам; в исходной работе это интерпретируется
    как признак образования твердого раствора азота в железе.
  kind: factual
  scope: Р6М5; электролитно-плазменное азотирование
  modality: qualified
  causal_level: interpretive
  required_qualifiers:
  - интерпретируется
  evidence:
  - source_id: S-RAK-83
    span: pdf_page:83
- id: C-002
  text: После азотирования в исследованных быстрорежущих сталях обнаруживается γ′-Fe4N.
  kind: factual
  scope: Р6М5, Р9, Р18
  modality: assertive
  causal_level: none
  evidence:
  - source_id: S-RAK-85
    span: pdf_page:85
- id: C-003
  text: Содержание γ′-Fe4N после азотирования составляет 5,5 % для Р9, 3,9 % для Р6М5
    и 3,7 % для Р18.
  kind: factual
  scope: Р6М5, Р9, Р18
  modality: assertive
  causal_level: none
  evidence:
  - source_id: S-RAK-85
    span: pdf_page:85-86
- id: C-004
  text: Нитриды легирующих элементов, наблюдавшиеся методом SEM, не были выявлены
    XRD; автор работы допускает, что причиной могут быть их малая концентрация и размер.
  kind: factual
  scope: быстрорежущие стали после азотирования
  modality: qualified
  causal_level: hypothesis
  required_qualifiers:
  - допускает
  evidence:
  - source_id: S-RAK-87
    span: pdf_page:87
- id: C-005
  text: В предварительно деформированном α-Fe при азотировании 853 K толщина нитридных
    слоев изменяется немонотонно, с максимумами при 3–5 % и 20–25 % деформации.
  kind: factual
  scope: α-Fe; 853 K
  modality: assertive
  causal_level: none
  evidence:
  - source_id: S-DEM-2
    span: pdf_page:2
- id: C-006
  text: В системе Fe-Cr четкие отражения CrN наблюдались после азотирования при 700
    °C, но не при 450 и 580 °C; это сопоставление показывает, что отсутствие линии
    XRD само по себе не доказывает отсутствие мелкодисперсной фазы.
  kind: factual
  scope: сравнительный пример Fe-Cr
  modality: qualified
  causal_level: interpretive
  required_qualifiers:
  - сопоставление
  evidence:
  - source_id: S-SCH-34
    span: pdf_page:34
sources:
- id: S-RAK-83
  sha256: 7d66930c00b8478d737e7f316353e813c2de997085768fa85bb99b39e32b8d81
  text: Содержание азота в поверхности стали Р6М5 достигает до 7 % (в весовых %).
    После азотирования наблюдается уширение, снижение интенсивности и сдвиг линии
    (110) α-фазы к меньшим углам; автор связывает это с образованием твердого раствора
    азота в железе.
- id: S-RAK-85
  sha256: 7d66930c00b8478d737e7f316353e813c2de997085768fa85bb99b39e32b8d81
  text: 'После азотирования на дифрактограммах Р9 и Р18 обнаружены линии Fe4N. Содержание
    γ′-Fe4N: Р9 5,5 %, Р6М5 3,9 %, Р18 3,7 %.'
- id: S-RAK-87
  sha256: 7d66930c00b8478d737e7f316353e813c2de997085768fa85bb99b39e32b8d81
  text: SEM выявляет мелкодисперсные нитриды легирующих элементов, однако XRD не выявил
    эти фазы; в тексте это связывается с низкой концентрацией и малым размером и предлагается
    TEM.
- id: S-DEM-1
  sha256: a48a2e08045adf42fb6e8a0211aed0900d5caa7c65796ba3c8c721f766f7b565
  text: Предварительная пластическая деформация 3–50 %; азотирование при 853 K. Ускоренное
    образование ε- и γ′-фаз отмечено в интервалах 3–8 % и 20–30 %.
- id: S-DEM-2
  sha256: a48a2e08045adf42fb6e8a0211aed0900d5caa7c65796ba3c8c721f766f7b565
  text: Толщина фазовых слоев меняется немонотонно; максимумы около 3–5 % и 20–25
    % деформации. Микротвердость заметно возрастает в интервалах 3–8 % и 20–30 %.
- id: S-SCH-34
  sha256: 4d419b93bbdd814fd10242f27c76bc25341de263ac8c45ded2e953aedfe88a15
  text: Для Fe-Cr при 700 °C наблюдались четкие отражения CrN, отсутствовавшие при
    450 и 580 °C; автор связывает это с укрупнением выделений.
graphs: []
