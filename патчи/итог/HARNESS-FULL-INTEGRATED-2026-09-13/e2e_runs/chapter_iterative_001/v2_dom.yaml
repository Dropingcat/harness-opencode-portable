structure:
  chapters:
  - id: CH-4
    title: Фазовые превращения при азотировании
    sections:
    - id: SEC-4.3
      role: discussion
      title: Фазовые превращения и обсуждение
      paragraphs:
      - id: PAR-1
        text: 'Рентгеноструктурные данные показывают, что после азотирования состояние
          α-фазы быстрорежущей стали изменяется: для Р6М5 отмечены уширение и снижение
          интенсивности линии (110), а также ее смещение к меньшим углам. В исходной
          работе это интерпретируется как признак образования твердого раствора азота
          в железе [C-001] [S-RAK-83]. Одновременно после азотирования для исследованных
          быстрорежущих сталей фиксируется γ′-Fe4N [C-002] [S-RAK-85]. Нитриды легирующих
          элементов, наблюдаемые методом SEM, при этом не выявлены XRD; автор допускает,
          что причиной могут быть их малая концентрация и размер [C-004] [S-RAK-87].'
        claims:
        - C-001
        - C-002
        - C-004
        evidence_refs:
        - S-RAK-83
        - S-RAK-85
        - S-RAK-87
        style_instruction_id: SI-26cc26a7143186a8
      - id: DP-002
        text: 'Количественный фазовый анализ дает различное содержание γ′-Fe4N: 5,5
          % для Р9, 3,9 % для Р6М5 и 3,7 % для Р18 [C-003] [S-RAK-85]. В качестве
          внешнего сопоставления можно отметить, что в предварительно деформированном
          α-Fe при азотировании 853 K толщина нитридных слоев изменялась немонотонно,
          с максимумами при 3–5 % и 20–25 % деформации [C-005] [S-DEM-2]. Эти данные
          относятся к другой системе и используются только как сравнительный пример
          чувствительности фазообразования к состоянию матрицы.'
        claims:
        - C-003
        - C-005
        evidence_refs:
        - S-RAK-85
        - S-DEM-2
        style_instruction_id: SI-26cc26a7143186a8
