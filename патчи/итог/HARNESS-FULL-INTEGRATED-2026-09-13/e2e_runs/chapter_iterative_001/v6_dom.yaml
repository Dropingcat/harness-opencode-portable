structure:
  chapters:
  - id: CH-4
    title: Фазовые превращения при азотировании
    sections:
    - id: SEC-4.3
      role: discussion
      title: Фазовые превращения и обсуждение
      paragraphs:
      - id: PAR-1
        text: 'После азотирования изменения α-фазы проявляются непосредственно в дифракционной
          картине: для Р6М5 линия (110) уширяется, ее интенсивность уменьшается, а
          максимум смещается к меньшим углам. В исходной работе совокупность этих
          признаков интерпретируется как образование твердого раствора азота в железе
          [C-001] [S-RAK-83]. На том же уровне анализа в исследованных быстрорежущих
          сталях фиксируется γ′-Fe4N [C-002] [S-RAK-85]. При этом SEM выявляет мелкодисперсные
          нитриды легирующих элементов, которые не обнаруживаются методом XRD; автор
          допускает, что такое расхождение может быть связано с их малой концентрацией
          и размером [C-004] [S-RAK-87]. Поэтому отрицательный результат фазового
          XRD в данном случае следует рассматривать с учетом предела обнаружения и
          при необходимости дополнять локальными методами анализа [C-007] [S-RAK-87].
          В системе Fe-Cr четкие отражения CrN появлялись при 700 °C, но отсутствовали
          при 450 и 580 °C; это сопоставление показывает, что отсутствие линии XRD
          само по себе не доказывает отсутствие мелкодисперсной фазы [C-006] [S-SCH-34].'
        claims:
        - C-001
        - C-002
        - C-004
        - C-006
        - C-007
        evidence_refs:
        - S-RAK-83
        - S-RAK-85
        - S-RAK-87
        - S-SCH-34
        style_instruction_id: SI-26cc26a7143186a8
      - id: DP-002
        text: Количественный анализ показывает, что содержание γ′-Fe4N после азотирования
          составляет 5,5 % для Р9, 3,9 % для Р6М5 и 3,7 % для Р18 [C-003] [S-RAK-85].
          Для сопоставления, в предварительно деформированном α-Fe при 853 K толщина
          нитридных слоев изменялась немонотонно и имела максимумы при 3–5 % и 20–25
          % деформации [C-005] [S-DEM-2]. Поскольку это другая материал-система и
          другой режим обработки, такое сопоставление не переносит количественную
          закономерность на быстрорежущие стали, а лишь показывает, что исходное дефектное
          состояние матрицы может сопровождаться немонотонным изменением параметров
          нитридного слоя.
        claims:
        - C-003
        - C-005
        evidence_refs:
        - S-RAK-85
        - S-DEM-2
        style_instruction_id: SI-26cc26a7143186a8
