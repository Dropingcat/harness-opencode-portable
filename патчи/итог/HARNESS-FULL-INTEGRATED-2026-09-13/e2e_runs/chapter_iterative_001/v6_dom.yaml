sources:
- id: S-RAK-83
  sha256: 7d66930c00b8478d737e7f316353e813c2de997085768fa85bb99b39e32b8d81
  text: Содержание азота в поверхности стали Р6М5 достигает до 7 % (в весовых %).
    После азотирования наблюдается уширение, снижение интенсивности и сдвиг линии
    (110) α-фазы к меньшим углам; автор связывает это с образованием твердого раствора
    азота в железе.
- id: S-RAK-85
  sha256: 7d66930c00b8478d737e7f316353e813c2de997085768fa85bb99b39e32b8d81
  text: 'После азотирования на дифрактограммах Р9 и Р18 обнаружены линии Fe4N. Содержание
    γ′-Fe4N: Р9 5,5 %, Р6М5 3,9 %, Р18 3,7 %.'
- id: S-RAK-87
  sha256: 7d66930c00b8478d737e7f316353e813c2de997085768fa85bb99b39e32b8d81
  text: SEM выявляет мелкодисперсные нитриды легирующих элементов, однако XRD не выявил
    эти фазы; в тексте это связывается с низкой концентрацией и малым размером и предлагается
    TEM.
- id: S-DEM-1
  sha256: a48a2e08045adf42fb6e8a0211aed0900d5caa7c65796ba3c8c721f766f7b565
  text: Предварительная пластическая деформация 3–50 %; азотирование при 853 K. Ускоренное
    образование ε- и γ′-фаз отмечено в интервалах 3–8 % и 20–30 %.
- id: S-DEM-2
  sha256: a48a2e08045adf42fb6e8a0211aed0900d5caa7c65796ba3c8c721f766f7b565
  text: Толщина фазовых слоев меняется немонотонно; максимумы около 3–5 % и 20–25
    % деформации. Микротвердость заметно возрастает в интервалах 3–8 % и 20–30 %.
- id: S-SCH-34
  sha256: 4d419b93bbdd814fd10242f27c76bc25341de263ac8c45ded2e953aedfe88a15
  text: Для Fe-Cr при 700 °C наблюдались четкие отражения CrN, отсутствовавшие при
    450 и 580 °C; автор связывает это с укрупнением выделений.
