[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writer-core"
version = "0.0.1"
description = "Writer core: document-as-code with unit-level versioning, provenance, and validation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pint>=0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "mypy>=1.0",
]

[project.scripts]
writer-artifact-check = "writer_core.artifact:main"
writer-debt-scan = "writer_core.debt:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true