schema_version: writer-routing/0.2
precedence:
- hard_policy_authority
- referential_integrity
- source_data_freshness
- epistemic_type_eligibility
- review_conflict
- structural_completeness
- semantic_realization
- style_optimization
routes:
- entity: ClaimSlot
  when: EMPTY
  operation: BindEligibleClaim
  on_failure: CreateMissingEvidenceBlocker
- entity: ClaimSlot
  when: TYPE_MISMATCH
  operation: RejectBinding
  on_failure: CreateSemanticTypeBlocker
- entity: WriterGap
  when: RESEARCHABLE
  operation: CreateResearchRequest
- entity: ArgumentNeed
  when: UNSATISFIED
  operation: InstantiateArgumentPattern
- entity: ArtifactSlot
  when: MISSING
  operation: ResolveArtifact
- entity: Artifact
  when: UPSTREAM_CHANGED
  operation: ComputeImpactClosure
- entity: Quantity
  when: UPSTREAM_CHANGED
  operation: RecomputeOrMarkReverify
- entity: RealizationTask
  when: READY
  operation: RealizeUnit
- entity: Realization
  when: CREATED_OR_CHANGED
  operation: BackExtractSemantics
- entity: RTTResult
  when: HARD_FAIL_REPAIRABLE
  operation: PlanSemanticRepair
- entity: RTTResult
  when: HARD_FAIL_UNREPAIRABLE
  operation: CreateBlocker
- entity: RTTResult
  when: PASS
  operation: CommitRealization
- entity: DependencyNode
  when: UPSTREAM_REVISION_CHANGED
  operation: ComputeImpactClosure
- entity: Term
  when: DEFINITION_CHANGED
  operation: InvalidateTermDependents
- entity: Formula
  when: IMPLEMENTATION_MISMATCH
  operation: BlockQuantitativeRelease
- entity: Figure
  when: SOURCE_DATA_STALE
  operation: RebuildArtifact
- entity: Caption
  when: CLAIM_EXTRACTED
  operation: ValidateCaptionClaims
- entity: ReviewIssue
  when: OPEN_AND_ACTIONABLE
  operation: ResolveReviewIssue
- entity: ReviewConflict
  when: OPEN
  operation: RequestDecision
- entity: BranchMerge
  when: SEMANTIC_CONFLICT
  operation: CreateMergeConflict
- entity: SourceVersion
  when: RETRACTED_OR_CORRECTED
  operation: InvalidateEvidenceClosure
- entity: ReleaseCandidate
  when: BLOCKERS_ZERO
  operation: BuildAndValidateExports
- entity: ExportArtifact
  when: PARSEBACK_OR_VISUAL_FAIL
  operation: CreateExportBlocker
- entity: ProjectState
  when: READY_QUEUE_NONEMPTY
  operation: DispatchHighestPriorityReadyOperation
