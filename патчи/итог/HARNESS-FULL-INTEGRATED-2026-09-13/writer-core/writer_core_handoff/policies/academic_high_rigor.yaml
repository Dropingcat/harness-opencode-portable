schema_version: writer-policy/0.2
id: academic_high_rigor
hard_gates:
- epistemic_fidelity
- citation_entailment
- numeric_integrity
- uncertainty_integrity
- artifact_lineage
- rtt
- global_consistency
- release_blockers_zero
free_generation_forbidden:
- number
- doi
- standard_id
- formula
- source_identity
- dataset_identity
human_or_expert_required:
- novelty_claim
- defense_position
- causal_upgrade
- release_override
- manual_raw_data_change
max_semantic_repair_iterations: 3
stale_critical_blocks_release: true
source_retraction_blocks_dependents: true
